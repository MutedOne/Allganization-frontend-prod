<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Add Request</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form [formGroup]="addRequest" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-12">
          <mat-label class="f-w-600 m-b-8 d-block">Choose Form</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <!-- <mat-select formControlName="form_id" (selectionChange)="getFormId($event)">
              @for(option of listApproveRequest; track option.id) {
              <mat-option [value]="option.id">{{
                option.name
              }}</mat-option>
              }
            </mat-select> -->
            <input
              type="text"
              placeholder="Choose Form"
              aria-label="Number"
              matInput
              formControlName="form_id"
              [matAutocomplete]="auto"
            />
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              @for (option of filteredOptions | async; track option) {
                <mat-option
                  [value]="option.name"
                  (onSelectionChange)="selectIdForm(option.id)"
                  >{{ option.name }}</mat-option
                >
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <!-- input -->
          <mat-label class="f-w-600 m-b-8 d-block">Purpose</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput placeholder="Purpose" formControlName="purpose" />
          </mat-form-field>
        </div>
      </div>

      <div class="m-t-12">
        <button
          mat-flat-button
          color="primary"
          class="m-r-8"
          type="submit"
          [disabled]="addRequest.invalid"
        >
          Submit
        </button>
        <button mat-stroked-button color="warn">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
