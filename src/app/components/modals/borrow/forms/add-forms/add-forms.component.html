<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Add Form</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form
      [formGroup]="formsForm"
      (ngSubmit)="onSubmit()"
      enctype="multipart/form-data"
    >
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block"></mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput placeholder="Form name" formControlName="fname" />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block"></mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="Form description"
              formControlName="fdescription"
            />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <!-- input -->
          <mat-label class="f-w-600 m-b-8 d-block"
            >Number of Approvers</mat-label
          >
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              type="number"
              placeholder="Number of Approvers"
              pattern="[0-9]*"
              formControlName="fapprovers"
            />
          </mat-form-field>
        </div>
        <input
          type="file"
          #fileInput
          (change)="onFileSelected($event)"
          accept="application/pdf"
          style="display: none"
        />
        <button
          mat-stroked-button
          type="button"
          color="primary"
          class="w-100"
          (click)="fileInput.click()"
        >
          <mat-icon>upload_file</mat-icon>
        </button>
        <button
          mat-menu-item
          (click)="openPDF()"
          type="button"
          [disabled]="isRequiredFieldsValid()"
        >
          <mat-icon>how_to_reg</mat-icon>
          <span>Upload form</span>
        </button>
      </div>

      <div class="m-t-12">
        <button
          mat-flat-button
          color="primary"
          class="m-r-8"
          type="submit"
          [disabled]="formsForm.invalid"
        >
          Submit
        </button>
      </div>
    </form>
  </mat-card-content>
  <mat-label class="f-w-600 m-b-8 d-block"
    >Preview Signatures Placement</mat-label
  >
  <iframe
    [src]="pdfUrl"
    width="100%"
    height="600px"
    (click)="getCoordinates($event)"
  ></iframe>
</mat-card>
