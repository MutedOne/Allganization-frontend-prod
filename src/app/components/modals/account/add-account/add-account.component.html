<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Add Account</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Username</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput placeholder="username" formControlName="username" />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Password </mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matTooltip="Password must be 8–13 characters long and include at least one uppercase letter, one lowercase letter, and one number."
              matInput
              type="password"
              formControlName="password"
              placeholder="password"
            />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Name</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput placeholder="Name " formControlName="name" />
          </mat-form-field>
        </div>
        <div class="col-lg-6"></div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Department</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input
              type="text"
              placeholder="Choose Department"
              aria-label="Number"
              matInput
              formControlName="department_id"
              [matAutocomplete]="auto"
            />
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              @for (option of filteredOptions | async; track option) {
              <mat-option [value]="option.name">{{ option.name }}</mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Position</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input
              type="text"
              placeholder="Choose Position"
              aria-label="Number"
              matInput
              formControlName="position_id"
              [matAutocomplete]="autoPosition"
            />
            <mat-autocomplete
              autoActiveFirstOption
              #autoPosition="matAutocomplete"
            >
              @for (option of filteredOptionPositions | async; track option) {
              <mat-option [value]="option.position">{{
                option.position
              }}</mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="col-lg-12">
          <mat-slide-toggle formControlName="isAdmin">Admin</mat-slide-toggle>
        </div>
      </div>

      <div class="m-t-12">
        <button
          mat-flat-button
          color="primary"
          class="m-r-8"
          type="submit"
          [disabled]="userForm.invalid"
        >
          Submit
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
