<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">View Position</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1 viewAccount">
    <form>
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Department</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="your name "
              [value]="getPositionDetails.department"
              disabled
            />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Position</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="your name "
              [value]="getPositionDetails.position"
              disabled
            />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Level</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="your name "
              [value]="getPositionDetails.level"
              disabled
            />
          </mat-form-field>
        </div>
      </div>
    </form>
    <mat-label class="f-w-600 m-b-8 d-block">People</mat-label>

    <app-list-account></app-list-account>
  </mat-card-content>
</mat-card>
