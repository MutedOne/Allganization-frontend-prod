<mat-card class="cardWithShadow theme-card">
  <mat-card-header>
    <mat-card-title class="m-b-0">Add Department</mat-card-title>
  </mat-card-header>
  <mat-card-content class="b-t-1">
    <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Code</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="Position code"
              formControlName="code"
              required
            />
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Department</mat-label>
          <mat-form-field appearance="outline" class="w-100">
            <input
              type="text"
              placeholder="Choose Department"
              aria-label="Number"
              matInput
              formControlName="department"
              [matAutocomplete]="auto"
            />
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              @for (option of filteredOptions | async; track option) {
              <mat-option [value]="option.name">{{ option.name }}</mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="col-lg-6">
          <mat-label class="f-w-600 m-b-8 d-block">Position</mat-label>
          <mat-form-field appearance="outline" class="w-100" color="primary">
            <input
              matInput
              placeholder="Position"
              formControlName="position"
              required
            />
          </mat-form-field>
        </div>
        <div class="col-lg-3">
          <mat-label class="f-w-600 m-b-8 d-block">level</mat-label>
          <mat-form-field class="w-100" appearance="outline">
            <input
              matInput
              type="number"
              placeholder="hirarchy level"
              formControlName="level"
            />
          </mat-form-field>
        </div>
      </div>

      <div class="m-t-12">
        <button
          mat-flat-button
          color="primary"
          class="m-r-8"
          type="submit"
          [disabled]="departmentForm.invalid"
        >
          Submit
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
