<mat-card class="cardWithShadow">
  <mat-card-content>
    @if(isLoading|async; as loading){
    <mat-spinner></mat-spinner>

    }
    <mat-card-title>Department</mat-card-title>

    <div class="table-responsive">
      <button
        mat-flat-button
        color="primary"
        (click)="openAddDepartment()"
        matBadgePosition="before"
        matBadgeColor="accent"
      >
        Add
      </button>
      @if(getPosition | async; as position){

      <table mat-table [dataSource]="position" class="w-100">
        <ng-container matColumnDef="assigned">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="f-w-600 mat-subtitle-1 f-s-14 p-l-0"
          >
            Position
          </th>
          <td mat-cell *matCellDef="let element" class="p-l-0">
            <div class="d-flex align-items-center">
              <img
                src="assets/images/profile/user-1.jpg"
                alt="users"
                width="60"
                class="rounded"
              />
              <div class="m-l-16">
                <h6 class="mat-subtitle-1 f-s-16 f-w-600">
                  {{ element.position }}
                </h6>
                <span class="f-s-14 f-w-500 d-block">{{
                  element.department
                }}</span>
                <span class="f-s-12 f-w-500 d-block">{{ element.level }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="quantity">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="f-w-600 mat-subtitle-1 f-s-14"
          >
            People
          </th>
          <td mat-cell *matCellDef="let element">
            <span
              class="bg-light-success text-success rounded f-w-600 p-6 p-y-4 f-s-12"
            >
              {{ element.quantity }}
            </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="f-w-600 mat-subtitle-1 f-s-14"
          ></th>
          <td mat-cell *matCellDef="let element" class="mat-body-1">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              aria-label="Example icon-button with a menu"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openViewDepartment(element)">
                <mat-icon>group</mat-icon>
                <span>View</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayTitle"></tr>
        <tr mat-row *matRowDef="let row; columns: displayTitle"></tr>
      </table>
      } 
      @if(totalListPosition | async; as total){ 
        @if(paginationDetails |
      async; as pagination){
      <mat-paginator
        [length]="total"
        [pageSize]="10"
        (page)="pageEvent($event)"
        [pageIndex]="pagination.currentPage"
        aria-label="Select page"
      >
      </mat-paginator>
      } 
    }
    </div>
  </mat-card-content>
</mat-card>
