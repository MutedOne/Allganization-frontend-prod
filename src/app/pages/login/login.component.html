<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center" id="Container-branding">
            <app-branding></app-branding>
          </div>
          <form class="m-t-30" [formGroup]="login" (ngSubmit)="onSubmit()">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Username</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="username" />
            </mat-form-field>
            <!-- password -->
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput type="password" formControlName="password" />
            </mat-form-field>
            @if (isError | async; as errorMsg) {
            <mat-error>{{ errorMsg }}</mat-error>
            }
            <button mat-flat-button color="primary" class="w-100" type="submit" [disabled]="login.invalid">
              Sign In
            </button>
            <br><br>
            <a href="https://www.youtube.com/watch?v=HLFQE8XoTDY&list=PLuaqGNP_0DJ_EmH6dZkmT2p1iuINNTCAX&index=23"
              target="_blank">
              <button mat-flat-button color="accent" class="w-100" type="button" [disabled]="login.invalid">
                Watch Origin
              </button>
            </a>
            <a href="/developer-info" target="_blank" title="Developer Info">
              <div id="developer-info" class="d-flex justify-content-end m-t-15">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor"
                  stroke-width="2" class="">
                  <polyline points="16 18 22 12 16 6" />
                  <polyline points="8 6 2 12 8 18" />
                </svg>
              </div>
            </a>

          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
